# xCloud (Docker + Nginx): file name docker-compose.yml, primary port 3000.
# xCloud's Nginx reverse-proxies this port. Do not add SSL or another proxy here.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      SALES_EXCEL_DRIVE_ID: ${SALES_EXCEL_DRIVE_ID:-}
      SALES_EXCEL_ITEM_ID: ${SALES_EXCEL_ITEM_ID:-}
      SALES_EXCEL_FILE_PATH: ${SALES_EXCEL_FILE_PATH:-}
      SALES_EXCEL_USER: ${SALES_EXCEL_USER:-}
      SALES_TV_KIOSK_TOKEN: ${SALES_TV_KIOSK_TOKEN:-}
      # Optional. Empty values are forwarded as empty and do not fail Compose.
      SURENSE_CLIENT_ID: ${SURENSE_CLIENT_ID:-}
      SURENSE_CLIENT_SECRET: ${SURENSE_CLIENT_SECRET:-}
      SURENSE_TOKEN_URL: ${SURENSE_TOKEN_URL:-}
      SURENSE_API_BASE: ${SURENSE_API_BASE:-}
      SURENSE_AUDIENCE: ${SURENSE_AUDIENCE:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_ACCESS_TOKEN: ${FACEBOOK_ACCESS_TOKEN:-}
      FACEBOOK_AD_ACCOUNT_ID: ${FACEBOOK_AD_ACCOUNT_ID:-}
      FACEBOOK_GRAPH_VERSION: ${FACEBOOK_GRAPH_VERSION:-}
      FACEBOOK_LIBA_AD_ACCOUNT_IDS: ${FACEBOOK_LIBA_AD_ACCOUNT_IDS:-}
      FACEBOOK_SHEMESH_AD_ACCOUNT_IDS: ${FACEBOOK_SHEMESH_AD_ACCOUNT_IDS:-}
      GOOGLE_SHEMESH_CUSTOMER_IDS: ${GOOGLE_SHEMESH_CUSTOMER_IDS:-}
      GOOGLE_LIBA_CUSTOMER_IDS: ${GOOGLE_LIBA_CUSTOMER_IDS:-}
      SHEMESH_FACEBOOK_AD_ACCOUNT_ID: ${SHEMESH_FACEBOOK_AD_ACCOUNT_ID:-}
      SHEMESH_FACEBOOK_ACCESS_TOKEN: ${SHEMESH_FACEBOOK_ACCESS_TOKEN:-}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s
    restart: unless-stopped
